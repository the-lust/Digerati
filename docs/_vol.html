<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>volumes</title>
<link rel="stylesheet" href="http://localhost:8127/assets/site.css">
</head>
<body>
<header class="site-header"><nav class="tabs">
  <button class="tab active" data-view="home">Home</button>
  <button class="tab" data-view="volumes">Volumes</button>
  <button class="tab" data-view="games">Games</button>
  <button class="tab" data-view="discs">Discs</button>
  <button class="tab" data-view="about">About</button>
</nav></header>
<div class="container">
  <section id="view-home" class="view active"><div class="hero"><div class="hero-stats" id="hero-stats"></div></div><div class="feature-grid" id="feature-grid"></div></section>
  <section id="view-volumes" class="view"><div class="view-head"><h2>Volumes <span id="vol-total" class="muted"></span></h2><div class="filters"><input type="search" id="vol-search" class="input"><select id="vol-filter" class="input"><option value="all">All</option><option value="numbered">N</option><option value="letter">L</option><option value="iso">I</option><option value="damaged">D</option></select></div></div><div id="volumes-grid" class="disc-grid"></div></section>
  <section id="view-games" class="view"><div class="view-head"><h2>Games <span id="game-total" class="muted"></span></h2><div class="filters"><input type="search" id="game-search" class="input"><select id="game-vol" class="input"><option value="">All</option></select></div></div><div id="games-list" class="game-list"></div><div id="games-pager" class="pager"></div></section>
  <section id="view-discs" class="view"><div class="view-head"><h2>Discs</h2><div class="filters"><input type="search" id="disc-search" class="input"><select id="disc-filter" class="input"><option value="all">A</option><option value="real">R</option><option value="payload">P</option></select></div></div><div id="discs-list" class="disc-grid"></div></section>
  <section id="view-about" class="view"><div class="about prose"></div></section>
</div>
<div id="modal" class="modal" hidden><div class="modal-backdrop" data-close></div><div class="modal-box"><button class="modal-x" data-close>&#10005;</button><div id="modal-body"></div></div></div>
<script src="http://localhost:8127/assets/site.js"></script>
<script>setTimeout(function(){ document.querySelector('[data-view="volumes"]').click(); }, 500);</script>
</body>
</html>
