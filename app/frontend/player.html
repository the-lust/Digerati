<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digerati player</title>
<script src="/ruffle/ruffle.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0507; color: #e8d9b8; font-family: 'Segoe UI', Tahoma, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .ph { color: #9a7b5a; font-size: 13px; text-align: center; padding: 20px; }
  .ph b { color: #f3b; font-size: 16px; }
  img, video, audio { max-width: 100%; max-height: 100%; }
  iframe, object { width: 100%; height: 100%; border: 0; }
  .full { width: 100%; height: 100%; }
  swf-embed { flex: 1; align-self: stretch; }
</style>
</head>
<body>
<div id="wrap">
  <div id="content"><div class="ph"><div class="spinner"></div><b>Loading…</b></div></div>
</div>
<script>
  (function () {
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      defaultContextMenu: "on",
      showOutline: false,
      openUrlMode: "deny",
      allowScriptAccess: "always",
      letterbox: "on",
    };

    const qs = new URLSearchParams(location.search);
    const src = qs.get("src") || "";
    const ext = (qs.get("ext") || "").toLowerCase();
    const wrap = document.getElementById("wrap");
    const content = document.getElementById("content");

    function fail(msg) {
      content.innerHTML = '<div class="ph"><b>Nothing to show</b><br>' + msg + '</div>';
    }

    if (!src) { fail("no file specified"); return; }

    const defExt = src.split(".").pop().toLowerCase();
    const kind = ext || defExt;

    if (kind === "swf") {
      wrap.style.alignItems = "stretch";
      content.style.width = "100%";
      content.innerHTML = '<swf-embed class="full" src="' + src + '" width="100%" height="100%"></swf-embed>';
      return;
    }

    if (["jpg", "jpeg", "png", "gif", "bmp", "pcx", "rgb", "svg", "webp"].indexOf(kind) >= 0) {
      content.innerHTML = '<img src="' + src + '">';
      return;
    }

    if (["mp3", "wav", "ogg", "m4a", "flac"].indexOf(kind) >= 0) {
      content.innerHTML =
        '<audio class="full" src="' + src + '" controls autoplay style="max-width:90%;max-height:90%"></audio>';
      return;
    }

    if (["mp4", "webm", "avi", "mov", "mkv"].indexOf(kind) >= 0) {
      content.innerHTML = '<video class="full" src="' + src + '" controls autoplay></video>';
      return;
    }

    if (kind === "pdf") {
      content.innerHTML = '<iframe class="full" src="' + src + '"></iframe>';
      return;
    }

    if (["txt", "html", "htm", "css", "js"].indexOf(kind) >= 0) {
      content.innerHTML = '<iframe class="full" src="' + src + '"></iframe>';
      return;
    }

    fail("unsupported file type: " + kind);
  })();
</script>
</body>
</html>
