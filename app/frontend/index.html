<html lang="en">

<title>Digerati</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="shell">
  <aside class="side">
    <div class="brand" title="Digerati">
      <img class="mark" src="logo.png" alt="Digerati" draggable="false">
      <div class="btxt"><em>Digerati</em><small>Disk archive</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="toolbar" id="toolbar" hidden>
      <input id="q" type="search" placeholder="Search games, tools, wallpapers…">
      <select id="volFilter"></select>
      <span class="count" id="count"></span>
      <button id="loadMore" hidden>Load more</button>
    </div>
    <main id="view"></main>
  </div>
</div>

<div id="toasts"></div>
